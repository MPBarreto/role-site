<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#07060a" />
  <meta name="description" content="Apresentação institucional e financeira do Rolê para investidores." />
  <title>Rolê — Investor Pitch</title>
  <base href="/pitch/investment/" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="./pitch.css" />
</head>
<body class="pitch-body">
  <a class="skip-link" href="#slide-1">Ir para a apresentação</a>
  <main class="pitch-deck" id="deck" aria-label="Apresentação de investimento do Rolê">
    <section class="slide is-active" id="slide-1" data-slide="1" aria-roledescription="slide" aria-label="1 de 12: Rolê: mais que ingressos, pessoas reais">
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-01.webp" alt="Tese do Rolê: uma plataforma que transforma eventos em conexões entre pessoas que vão ao mesmo show." width="1672" height="941" fetchpriority="high" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-2" data-slide="2" aria-roledescription="slide" aria-label="2 de 12: O problema" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-02.webp" alt="Problemas de descoberta, venda e relacionamento entre público, produtores e plataformas de eventos." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-3" data-slide="3" aria-roledescription="slide" aria-label="3 de 12: A solução" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-03.webp" alt="Jornada do Rolê com descoberta de evento, compra de ingresso, conexões sociais e conversa." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-4" data-slide="4" aria-roledescription="slide" aria-label="4 de 12: Tamanho de mercado" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-04.webp" alt="Estimativas de TAM, SAM e SOM para o mercado de entretenimento e eventos." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-5" data-slide="5" aria-roledescription="slide" aria-label="5 de 12: Produto" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-05.webp" alt="Telas e recursos do aplicativo Rolê para descobrir eventos, comprar ingressos e conhecer pessoas." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-6" data-slide="6" aria-roledescription="slide" aria-label="6 de 12: Tração" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-06.webp" alt="Marcos de produto, operação, lançamento local, plano de crescimento e projeção de break-even." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-7" data-slide="7" aria-roledescription="slide" aria-label="7 de 12: Modelo de negócio" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-07.webp" alt="Taxa Rolê de 10% sobre o GMV do ingresso: em um ingresso de R$ 100, a taxa é R$ 10. O slide também apresenta serviços para produtores e ativações de marca." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-8" data-slide="8" aria-roledescription="slide" aria-label="8 de 12: Competição" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-08.webp" alt="Comparativo de ticketing, descoberta social, público confirmado, matches e ferramentas para hosts. Rolê, Sympla, Zig e Ingresse oferecem ferramentas para hosts." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-9" data-slide="9" aria-roledescription="slide" aria-label="9 de 12: Estratégia go-to-market" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-09.webp" alt="Expansão local em Curitiba, seguida por outras cidades do Sul, Sudeste e América Latina." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-10" data-slide="10" aria-roledescription="slide" aria-label="10 de 12: Equipe" aria-hidden="true" inert>
      <div class="slide-canvas" style="--slide-ratio: 1.776833">
        <img class="reference-art" src="./assets/slide-10.webp" alt="Apresentação dos fundadores. Marcos Barreto foi VP da Associação Baiana de Startups em 2023 e 2024; Jaevillen Oliveira é CTO." width="1672" height="941" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>

    <section class="slide" id="slide-11" data-slide="11" aria-roledescription="slide" aria-label="11 de 12: Projeções financeiras" aria-hidden="true" inert>
      <div class="slide-canvas slide-canvas-portrait-art" style="--slide-ratio: 1.777778">
        <div class="slide-11-art">
          <img class="reference-art" src="./assets/slide-11.webp" alt="Composição visual do slide com projeções financeiras para 18 meses." width="1018" height="768" loading="lazy" decoding="async" draggable="false" />
          <div class="finance-chart-host" data-finance-chart></div>
        </div>
      </div>
    </section>

    <section class="slide" id="slide-12" data-slide="12" aria-roledescription="slide" aria-label="12 de 12: O pedido" aria-hidden="true" inert>
      <div class="slide-canvas slide-canvas-portrait-art" style="--slide-ratio: 1.777778">
        <img class="reference-art" src="./assets/slide-12.webp" alt="Captação de R$ 450 mil por 15% de equity, com alocação do capital e marcos para os próximos 18 meses." width="1018" height="768" loading="lazy" decoding="async" draggable="false" />
      </div>
    </section>
  </main>
  <nav class="deck-controls" aria-label="Controles da apresentação">
    <button class="deck-control" type="button" data-previous aria-label="Slide anterior">Anterior</button>
    <div class="deck-progress" role="progressbar" aria-label="Progresso da apresentação" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1"><span data-progress-fill></span></div>
    <span class="deck-counter" data-counter aria-live="polite">01 <i>/</i> 12</span>
    <div class="deck-pages" role="group" aria-label="Ir para slide"><button type="button" data-go="1" aria-label="Ir para slide 1" aria-current="step">01</button><button type="button" data-go="2" aria-label="Ir para slide 2">02</button><button type="button" data-go="3" aria-label="Ir para slide 3">03</button><button type="button" data-go="4" aria-label="Ir para slide 4">04</button><button type="button" data-go="5" aria-label="Ir para slide 5">05</button><button type="button" data-go="6" aria-label="Ir para slide 6">06</button><button type="button" data-go="7" aria-label="Ir para slide 7">07</button><button type="button" data-go="8" aria-label="Ir para slide 8">08</button><button type="button" data-go="9" aria-label="Ir para slide 9">09</button><button type="button" data-go="10" aria-label="Ir para slide 10">10</button><button type="button" data-go="11" aria-label="Ir para slide 11">11</button><button type="button" data-go="12" aria-label="Ir para slide 12">12</button></div>
    <button class="deck-control" type="button" data-next aria-label="Próximo slide">Próximo</button>
    <button class="deck-print" type="button" data-print aria-label="Imprimir ou salvar como PDF">PDF</button>
  </nav>
  <script type="module" src="./pitch.js"></script>
</body>
</html>
